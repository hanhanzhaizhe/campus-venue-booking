server:
  port: 8080

spring:
  application:
    name: venue-booking
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET:venue-booking-dev-hmac-secret-key-32b}
  expire-seconds: 86400

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method

logging:
  level:
    com.campus.venue: info
